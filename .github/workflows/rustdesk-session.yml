
name: Mac qusai

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Session duration (hours)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
      macos_version:
        description: 'macOS version'
        required: true
        default: '27'
        type: choice
        options:
          - '14'
          - '15'
          - '26'
          - '27'
      runner_size:
        description: 'Runner size (standard=Free/Pro, large/xlarge=Team/Enterprise, intel=macOS 26 only; macOS 27 uses xcode-27 runners)'
        required: true
        default: 'standard'
        type: choice
        options:
          - 'standard'
          - 'large'
          - 'xlarge'
          - 'intel'
      unique_ip:
        description: 'Ensure unique IP via Cloudflare WARP VPN'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  SESSION_DURATION: ${{ github.event.inputs.duration || 5 }}

jobs:
  mac-rustdesk-session:
    name: 🦀 Mac RustDesk Session (macOS ${{ github.event.inputs.macos_version }})
    runs-on: ${{ github.event.inputs.macos_version == '27' && github.event.inputs.runner_size == 'standard' && 'xcode-27' || github.event.inputs.macos_version == '27' && github.event.inputs.runner_size == 'xlarge' && 'xcode-27-xlarge' || github.event.inputs.macos_version == '27' && 'unsupported-macos-27-runner-size' || github.event.inputs.runner_size == 'xlarge' && format('macos-{0}-xlarge', github.event.inputs.macos_version) || github.event.inputs.runner_size == 'large' && format('macos-{0}-large', github.event.inputs.macos_version) || github.event.inputs.runner_size == 'intel' && github.event.inputs.macos_version == '26' && 'macos-26-intel' || github.event.inputs.runner_size == 'intel' && 'unsupported-intel-runner-version' || format('macos-{0}', github.event.inputs.macos_version) }}
    timeout-minutes: 370

    steps:
      - name: ❌ Validate runner selection
        if: (github.event.inputs.macos_version == '27' && github.event.inputs.runner_size == 'large') || (github.event.inputs.runner_size == 'intel' && github.event.inputs.macos_version != '26')
        run: |
          echo "::error::Unsupported runner selection. macOS 27 supports standard (xcode-27) or xlarge (xcode-27-xlarge) in this workflow. Intel is only configured for macOS 26."
          exit 1

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔗 Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false

      - name: 🔧 Restore DNS after Tailscale
        run: |
          for svc in "Wi-Fi" "Ethernet" "USB 10/100/1000 LAN" "Thunderbolt Bridge"; do
            networksetup -setdnsservers "$svc" 1.1.1.1 8.8.8.8 2>/dev/null || true
          done
          dscacheutil -flushcache 2>/dev/null || true
          killall -HUP mDNSResponder 2>/dev/null || true

      - name: 🌐 Install Google Chrome
        run: |
          set -e

          if [ -d "/Applications/Google Chrome.app" ]; then
            echo "Google Chrome is already installed."
          else
            if ! command -v brew >/dev/null 2>&1; then
              echo "::error::Homebrew is not available; cannot install Google Chrome."
              exit 1
            fi
            brew install --cask google-chrome
          fi

          if [ ! -d "/Applications/Google Chrome.app" ]; then
            echo "::error::Google Chrome installation failed."
            exit 1
          fi

          echo "Google Chrome is ready."

      - name: 🤖 Hermes Agent + Hermex
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          export HERMES_PORT="${HERMES_PORT:-9119}"

          if ! command -v hermes >/dev/null 2>&1; then
            echo "Installing Hermes Agent..."
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
            export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          fi

          if ! command -v hermes >/dev/null 2>&1; then
            echo "::error::Hermes installation failed or the CLI is not on PATH."
            exit 1
          fi

          echo "Hermes CLI is installed."

          HERMEX_DIR="$HOME/Desktop/hermex"
          mkdir -p "$HOME/Desktop"

          if [ ! -d "$HERMEX_DIR" ]; then
            git clone https://github.com/kosaai/hermex.git "$HERMEX_DIR"
          else
            echo "Hermex directory already exists."
          fi

          if [ -x /Applications/Tailscale.app/Contents/MacOS/Tailscale ]; then
            TS_CLI="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          else
            TS_CLI="tailscale"
          fi

          TAILSCALE_IP=$("$TS_CLI" ip -4 2>/dev/null | head -1 || true)
          echo "TAILSCALE_IP=${TAILSCALE_IP}" >> "$GITHUB_ENV"
          echo "HERMES_URL=" >> "$GITHUB_ENV"

          echo "Hermes is installed; Portal authentication will start after RustDesk setup."
          echo "Tailnet: ${TAILSCALE_IP:-'(unavailable)'}"

      - name: 📦 Restore IP History Cache
        uses: actions/cache@v4
        with:
          path: .ip-history.json
          key: ip-history-${{ github.repository_owner }}
          restore-keys: |
            ip-history-

      - name: 🌐 Detect and Track IP
        run: |
          chmod +x scripts/ip-manager.sh
          ./scripts/ip-manager.sh

      - name: 🔒 Setup Unique IP (Cloudflare WARP)
        if: github.event.inputs.unique_ip == 'true'
        run: |
          chmod +x scripts/setup-warp.sh
          ./scripts/setup-warp.sh

      - name: 🔐 Create Admin User for GUI Authentication
        run: |
          ADMIN_USER="yourname"
          echo "MAC_USER=${ADMIN_USER}" >> "$GITHUB_ENV"

          MAC_PASSWORD=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 12)

          echo "::add-mask::${MAC_PASSWORD}"
          echo "MAC_PASSWORD=${MAC_PASSWORD}" >> "$GITHUB_ENV"

          echo "👤 Creating admin user: ${ADMIN_USER}"

          if id "${ADMIN_USER}" &>/dev/null; then
            echo "User ${ADMIN_USER} already exists, setting password..."
            sudo dscl . -passwd "/Users/${ADMIN_USER}" "" "${MAC_PASSWORD}" 2>/dev/null || \
            sudo sysadminctl -resetPasswordFor "${ADMIN_USER}" -newPassword "${MAC_PASSWORD}" 2>/dev/null || true
          else
            LAST_UID=$(dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -1)
            NEW_UID=$((LAST_UID + 1))

            echo "Creating user with UID: ${NEW_UID}"

            sudo dscl . -create "/Users/${ADMIN_USER}"
            sudo dscl . -create "/Users/${ADMIN_USER}" UserShell /bin/zsh
            sudo dscl . -create "/Users/${ADMIN_USER}" RealName "Your Name"
            sudo dscl . -create "/Users/${ADMIN_USER}" UniqueID "${NEW_UID}"
            sudo dscl . -create "/Users/${ADMIN_USER}" PrimaryGroupID 20
            sudo dscl . -create "/Users/${ADMIN_USER}" NFSHomeDirectory "/Users/${ADMIN_USER}"

            sudo dscl . -passwd "/Users/${ADMIN_USER}" "${MAC_PASSWORD}"
            sudo dseditgroup -o edit -a "${ADMIN_USER}" -t user admin

            sudo createhomedir -c -u "${ADMIN_USER}" 2>/dev/null || sudo mkdir -p "/Users/${ADMIN_USER}"
            sudo chown -R "${ADMIN_USER}:staff" "/Users/${ADMIN_USER}" 2>/dev/null || true
          fi

          if id "${ADMIN_USER}" &>/dev/null; then
            echo "✅ User ${ADMIN_USER} exists."
            if dseditgroup -o checkmember -m "${ADMIN_USER}" admin 2>/dev/null; then
              echo "✅ User ${ADMIN_USER} is an admin."
            fi
          else
            echo "::warning::Failed to verify admin user creation."
          fi

          echo "User: ${ADMIN_USER}"
          echo "Password: (in artifact file)"

      - name: 📊 System Information
        run: |
          chmod +x scripts/system-info.sh
          ./scripts/system-info.sh

      - name: 🎮 Install Parsec (for optional manual use)
        run: |
          chmod +x scripts/install-parsec.sh
          ./scripts/install-parsec.sh

      - name: 🦀 Setup RustDesk
        id: rustdesk
        run: |
          chmod +x scripts/setup-rustdesk.sh

          RUSTDESK_PASSWORD=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 12)

          echo "::add-mask::${RUSTDESK_PASSWORD}"
          echo "RUSTDESK_PASSWORD=${RUSTDESK_PASSWORD}" >> "$GITHUB_ENV"

          export RUSTDESK_PASSWORD
          ./scripts/setup-rustdesk.sh

          sleep 10

      - name: 🔑 Get RustDesk ID
        id: get_id
        run: |
          sleep 5

          RUSTDESK_CLI="/Applications/RustDesk.app/Contents/MacOS/rustdesk"

          if [ -f "$RUSTDESK_CLI" ]; then
            RUSTDESK_ID=$("$RUSTDESK_CLI" --get-id 2>/dev/null || echo "")

            if [ -z "$RUSTDESK_ID" ]; then
              CONFIG_DIR="$HOME/Library/Application Support/RustDesk"
              RUSTDESK_ID=$(cat "${CONFIG_DIR}/id" 2>/dev/null || echo "")
            fi

            if [ -n "$RUSTDESK_ID" ]; then
              echo "RUSTDESK_ID=${RUSTDESK_ID}" >> "$GITHUB_ENV"
              echo "✅ RustDesk ID: ${RUSTDESK_ID}"
            else
              echo "⚠️ Could not retrieve RustDesk ID automatically"
              echo "RUSTDESK_ID=Check_Logs" >> "$GITHUB_ENV"
            fi
          else
            echo "⚠️ RustDesk executable not found"
            echo "RUSTDESK_ID=Check_Logs" >> "$GITHUB_ENV"
          fi

      - name: 🔐 Start Hermes Portal Authentication
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"

          DESKTOP="$HOME/Desktop"
          AUTH_SCRIPT="$DESKTOP/start-hermes-auth.sh"
          AUTH_LOG="$DESKTOP/Hermes-Auth.log"
          INSTRUCTIONS="$DESKTOP/Hermes-Authentication-Instructions.txt"

          mkdir -p "$DESKTOP"

          if ! command -v hermes >/dev/null 2>&1; then
            echo "::error::Hermes CLI is not installed or not on PATH."
            exit 1
          fi

          if [ ! -d "/Applications/Google Chrome.app" ]; then
            echo "::error::Google Chrome is not installed."
            exit 1
          fi

          if [ ! -d "/Applications/RustDesk.app" ]; then
            echo "::error::RustDesk.app was not found."
            exit 1
          fi

          cat > "$INSTRUCTIONS" <<'EOF'
          HERMES PORTAL AUTHENTICATION

          1. Connect to this Mac using RustDesk.
          2. Find the Terminal window named for Hermes Portal authentication.
          3. Complete the Nous Portal login in Google Chrome.
          4. Return to Terminal and finish any setup or model-selection prompts.
          5. Check Hermes-Auth.log on the Desktop if setup fails.

          Keep authentication tokens private. Do not share the log publicly.
          EOF

          cat > "$AUTH_SCRIPT" <<'AUTH_EOF'
          #!/bin/bash

          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          export BROWSER='open -a "Google Chrome" %s'

          LOG="$HOME/Desktop/Hermes-Auth.log"

          echo "========================================" >> "$LOG"
          echo "Hermes Portal authentication started: $(date)" >> "$LOG"
          echo "========================================" >> "$LOG"

          open -a "Google Chrome" 2>&1 | tee -a "$LOG" || true

          echo ""
          echo "Starting official Hermes Portal setup..."
          echo "Complete the login in Chrome, then return to this Terminal."
          echo ""

          hermes setup --portal 2>&1 | tee -a "$LOG"
          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -eq 0 ]; then
            echo ""
            echo "Hermes Portal setup command completed." | tee -a "$LOG"
            hermes portal info 2>&1 | tee -a "$LOG" || true
          else
            echo ""
            echo "Hermes setup exited with code $RESULT." | tee -a "$LOG"
          fi

          echo ""
          echo "Authentication terminal remains open."
          read -r -p "Press Enter to close this Terminal session: "
          AUTH_EOF

          chmod +x "$AUTH_SCRIPT"

          osascript <<'APPLESCRIPT'
          tell application "Terminal"
            activate
            do script "bash \"$HOME/Desktop/start-hermes-auth.sh\""
          end tell
          APPLESCRIPT

          echo "Authentication launched in a separate Terminal window."
          echo "Instructions: $INSTRUCTIONS"
          echo "Log file: $AUTH_LOG"

      - name: 💾 Save Credentials (Private File)
        run: |
          mkdir -p credentials

          cat > credentials/connection-info.txt << EOF
          ════════════════════════════════════════════════════════════
                    GITHUB MAC REMOTE - CREDENTIALS
          ════════════════════════════════════════════════════════════

          Started by: ${{ github.actor }}
          Date/Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Run ID: ${{ github.run_id }}

          ────────────────────────────────────────────────────────────
          Network Information:
          ────────────────────────────────────────────────────────────

          Public IP:  ${{ env.CURRENT_IP }}
          Location:   ${{ env.IP_CITY }}, ${{ env.IP_COUNTRY }}
          Provider:   ${{ env.IP_ORG }}
          WARP VPN:   ${{ env.WARP_ENABLED || 'false' }}

          ────────────────────────────────────────────────────────────
          RustDesk Credentials:
          ────────────────────────────────────────────────────────────

          ID:       ${{ env.RUSTDESK_ID }}
          Password: ${{ env.RUSTDESK_PASSWORD }}

          ────────────────────────────────────────────────────────────
          Hermes Agent (Tailscale):
          ────────────────────────────────────────────────────────────

          URL:      ${{ env.HERMES_URL || '(server not started)' }}
          Tailnet:  ${{ env.TAILSCALE_IP || '(same tailnet as this runner)' }}

          ────────────────────────────────────────────────────────────
          macOS Admin Credentials:
          ────────────────────────────────────────────────────────────

          User:     ${{ env.MAC_USER }}
          Password: ${{ env.MAC_PASSWORD }}

          Use these credentials for System Settings and admin authentication.

          ────────────────────────────────────────────────────────────
          How to Connect:
          ────────────────────────────────────────────────────────────

          1. Download RustDesk from: https://rustdesk.com/download
          2. Install and open RustDesk on your computer
          3. Enter the RustDesk ID shown above
          4. Enter the RustDesk password shown above
          5. Click Connect!

          WARNING: This file contains sensitive credentials.
          Do not share with others.
          ════════════════════════════════════════════════════════════
          EOF

      - name: 📦 Upload Credentials Artifact
        uses: actions/upload-artifact@v4
        with:
          name: credentials-${{ github.actor }}-${{ github.run_id }}
          path: credentials/
          retention-days: 1

      - name: 📋 Connection Instructions
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║              🦀 GITHUB MAC REMOTE - READY                        ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Session started by: ${{ github.actor }}"
          echo ""
          echo "Public IP: ${{ env.CURRENT_IP }}"
          echo "Location: ${{ env.IP_CITY }}, ${{ env.IP_COUNTRY }}"
          if [ "${{ env.WARP_ENABLED }}" = "true" ]; then
            echo "VPN: Cloudflare WARP (Unique IP Enabled)"
          fi
          if [ "${{ env.IP_IS_DUPLICATE }}" = "true" ]; then
            echo "WARNING: This IP was previously used!"
          fi
          echo ""
          echo "macOS User: ${{ env.MAC_USER }}"
          echo "macOS Password: (in artifact)"
          echo ""
          echo "RustDesk ID: ${{ env.RUSTDESK_ID }}"
          echo "RustDesk Password: (in artifact)"
          echo ""
          echo "Hermes URL: ${{ env.HERMES_URL || '(server not started)' }}"
          echo "Hermex:     /Users/runner/Desktop/hermex"
          echo ""
          echo "Download artifact: credentials-${{ github.actor }}-${{ github.run_id }}"
          echo ""
          echo "Session active for ${{ env.SESSION_DURATION }} hour(s)"
          echo "Passwords are NOT displayed in logs."

      - name: ⏱️ Keep Session Alive
        run: |
          chmod +x scripts/keep-alive.sh

          export DURATION_HOURS="${{ env.SESSION_DURATION }}"
          ./scripts/keep-alive.sh

      - name: 💾 Save IP History Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ip-history.json
          key: ip-history-${{ github.repository_owner }}-${{ github.run_id }}
