name: Mac qusai

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Session duration (hours)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
      macos_version:
        description: 'macOS version'
        required: true
        default: '27'
        type: choice
        options:
          - '14'
          - '15'
          - '26'
          - '27'
      runner_size:
        description: 'Runner size (standard=Free/Pro, large/xlarge=Team/Enterprise, intel=macOS 26 only; macOS 27 uses xcode-27 runners)'
        required: true
        default: 'standard'
        type: choice
        options:
          - 'standard'
          - 'large'
          - 'xlarge'
          - 'intel'
      unique_ip:
        description: 'Ensure unique IP via Cloudflare WARP VPN'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  SESSION_DURATION: ${{ github.event.inputs.duration || 5 }}

jobs:
  mac-rustdesk-session:
    name: Mac RustDesk Session (macOS ${{ github.event.inputs.macos_version }})
    runs-on: ${{ github.event.inputs.macos_version == '27' && github.event.inputs.runner_size == 'standard' && 'xcode-27' || github.event.inputs.macos_version == '27' && github.event.inputs.runner_size == 'xlarge' && 'xcode-27-xlarge' || github.event.inputs.macos_version == '27' && 'unsupported-macos-27-runner-size' || github.event.inputs.runner_size == 'xlarge' && format('macos-{0}-xlarge', github.event.inputs.macos_version) || github.event.inputs.runner_size == 'large' && format('macos-{0}-large', github.event.inputs.macos_version) || github.event.inputs.runner_size == 'intel' && github.event.inputs.macos_version == '26' && 'macos-26-intel' || github.event.inputs.runner_size == 'intel' && 'unsupported-intel-runner-version' || format('macos-{0}', github.event.inputs.macos_version) }}
    timeout-minutes: 370

    steps:
      - name: Validate runner selection
        if: (github.event.inputs.macos_version == '27' && github.event.inputs.runner_size == 'large') || (github.event.inputs.runner_size == 'intel' && github.event.inputs.macos_version != '26')
        run: |
          echo "::error::Unsupported runner selection. macOS 27 supports standard or xlarge. Intel is only configured for macOS 26."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false

      - name: Restore DNS after Tailscale
        run: |
          for svc in "Wi-Fi" "Ethernet" "USB 10/100/1000 LAN" "Thunderbolt Bridge"; do
            networksetup -setdnsservers "$svc" 1.1.1.1 8.8.8.8 2>/dev/null || true
          done
          dscacheutil -flushcache 2>/dev/null || true
          killall -HUP mDNSResponder 2>/dev/null || true

      - name: Install Google Chrome
        run: |
          set -e
          if [ -d "/Applications/Google Chrome.app" ]; then
            echo "Google Chrome is already installed."
          else
            command -v brew >/dev/null 2>&1 || {
              echo "::error::Homebrew is not available."
              exit 1
            }
            brew install --cask google-chrome
          fi
          test -d "/Applications/Google Chrome.app"

      - name: Install Hermes Agent and Hermex
        run: |
          set -e
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          mkdir -p "$HOME/Desktop"

          if ! command -v hermes >/dev/null 2>&1; then
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
            export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          fi

          command -v hermes >/dev/null 2>&1 || {
            echo "::error::Hermes installation failed."
            exit 1
          }

          HERMEX_DIR="$HOME/Desktop/hermex"
          if [ ! -d "$HERMEX_DIR" ]; then
            git clone https://github.com/kosaai/hermex.git "$HERMEX_DIR"
          fi

          TS_IP=$(tailscale ip -4 2>/dev/null | head -1 || true)
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "HERMES_URL=" >> "$GITHUB_ENV"

          echo "Hermes and Hermex are ready."
          echo "Tailscale IP: ${TS_IP:-unavailable}"

      - name: Restore IP History Cache
        uses: actions/cache@v4
        with:
          path: .ip-history.json
          key: ip-history-${{ github.repository_owner }}
          restore-keys: |
            ip-history-

      - name: Detect and Track IP
        run: |
          chmod +x scripts/ip-manager.sh
          ./scripts/ip-manager.sh

      - name: Setup Unique IP (Cloudflare WARP)
        if: github.event.inputs.unique_ip == 'true'
        run: |
          chmod +x scripts/setup-warp.sh
          ./scripts/setup-warp.sh

      - name: Create Admin User for GUI Authentication
        run: |
          set -e
          ADMIN_USER="yourname"
          echo "MAC_USER=$ADMIN_USER" >> "$GITHUB_ENV"

          MAC_PASSWORD=$(openssl rand -hex 12)
          echo "::add-mask::$MAC_PASSWORD"
          echo "MAC_PASSWORD=$MAC_PASSWORD" >> "$GITHUB_ENV"

          if id "$ADMIN_USER" >/dev/null 2>&1; then
            sudo dscl . -passwd "/Users/$ADMIN_USER" "$MAC_PASSWORD"
          else
            LAST_UID=$(dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -1)
            NEW_UID=$((LAST_UID + 1))

            sudo dscl . -create "/Users/$ADMIN_USER"
            sudo dscl . -create "/Users/$ADMIN_USER" UserShell /bin/zsh
            sudo dscl . -create "/Users/$ADMIN_USER" RealName "Your Name"
            sudo dscl . -create "/Users/$ADMIN_USER" UniqueID "$NEW_UID"
            sudo dscl . -create "/Users/$ADMIN_USER" PrimaryGroupID 20
            sudo dscl . -create "/Users/$ADMIN_USER" NFSHomeDirectory "/Users/$ADMIN_USER"
            sudo dscl . -passwd "/Users/$ADMIN_USER" "$MAC_PASSWORD"
            sudo dseditgroup -o edit -a "$ADMIN_USER" -t user admin
            sudo createhomedir -c -u "$ADMIN_USER" 2>/dev/null || sudo mkdir -p "/Users/$ADMIN_USER"
            sudo chown -R "$ADMIN_USER:staff" "/Users/$ADMIN_USER" 2>/dev/null || true
          fi

          id "$ADMIN_USER" >/dev/null 2>&1 || {
            echo "::error::Could not verify macOS user."
            exit 1
          }

          echo "macOS user created. Password is masked."

      - name: System Information
        run: |
          chmod +x scripts/system-info.sh
          ./scripts/system-info.sh

      - name: Install Parsec
        run: |
          chmod +x scripts/install-parsec.sh
          ./scripts/install-parsec.sh

      - name: Setup RustDesk
        id: rustdesk
        run: |
          set -e
          chmod +x scripts/setup-rustdesk.sh

          RUSTDESK_PASSWORD=$(openssl rand -hex 12)
          echo "::add-mask::$RUSTDESK_PASSWORD"
          echo "RUSTDESK_PASSWORD=$RUSTDESK_PASSWORD" >> "$GITHUB_ENV"

          export RUSTDESK_PASSWORD
          ./scripts/setup-rustdesk.sh
          sleep 10

      - name: Get RustDesk ID
        id: get_id
        run: |
          sleep 5
          RUSTDESK_CLI="/Applications/RustDesk.app/Contents/MacOS/rustdesk"
          RUSTDESK_ID=""

          if [ -f "$RUSTDESK_CLI" ]; then
            RUSTDESK_ID=$("$RUSTDESK_CLI" --get-id 2>/dev/null || true)
          fi

          if [ -z "$RUSTDESK_ID" ]; then
            CONFIG_DIR="$HOME/Library/Application Support/RustDesk"
            RUSTDESK_ID=$(cat "${CONFIG_DIR}/id" 2>/dev/null || true)
          fi

          if [ -n "$RUSTDESK_ID" ]; then
            echo "RUSTDESK_ID=$RUSTDESK_ID" >> "$GITHUB_ENV"
            echo "RUSTDESK_ID=$RUSTDESK_ID" >> "$GITHUB_OUTPUT"
            echo "RustDesk ID retrieved."
          else
            echo "RUSTDESK_ID=Check_Logs" >> "$GITHUB_ENV"
            echo "RUSTDESK_ID=Check_Logs" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not retrieve RustDesk ID."
          fi

      - name: Start Hermes Portal Authentication
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"

          DESKTOP="$HOME/Desktop"
          AUTH_SCRIPT="$DESKTOP/start-hermes-auth.sh"
          AUTH_LOG="$DESKTOP/Hermes-Auth.log"
          INSTRUCTIONS="$DESKTOP/Hermes-Authentication-Instructions.txt"
          LAUNCH_LOG="$RUNNER_TEMP/hermes-terminal-launch.log"

          mkdir -p "$DESKTOP"

          if ! command -v hermes >/dev/null 2>&1; then
            echo "::warning::Hermes CLI not found; skipping authentication."
            exit 0
          fi

          cat > "$INSTRUCTIONS" <<'EOF'
          HERMES PORTAL AUTHENTICATION

          1. Connect to this Mac using RustDesk.
          2. Find the Terminal window for Hermes authentication.
          3. Complete the Nous Portal login in Google Chrome.
          4. Return to Terminal and finish setup.
          5. Check Hermes-Auth.log if setup fails.

          Keep authentication tokens private.
          EOF

          cat > "$AUTH_SCRIPT" <<'AUTH_EOF'
          #!/bin/bash
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"

          LOG="$HOME/Desktop/Hermes-Auth.log"
          echo "Hermes Portal setup started: $(date)" >> "$LOG"

          open -a "Google Chrome" >> "$LOG" 2>&1 || true
          hermes setup --portal 2>&1 | tee -a "$LOG"
          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -eq 0 ]; then
            hermes portal info 2>&1 | tee -a "$LOG" || true
          else
            echo "Hermes setup exited with code $RESULT." | tee -a "$LOG"
          fi

          echo ""
          read -r -p "Press Enter to close this Terminal session: "
          AUTH_EOF

          chmod +x "$AUTH_SCRIPT"

          cat > "$RUNNER_TEMP/launch-hermes-terminal.applescript" <<'APPLESCRIPT'
          tell application "Terminal"
            activate
            do script "bash \"$HOME/Desktop/start-hermes-auth.sh\""
          end tell
          APPLESCRIPT

          nohup /usr/bin/osascript "$RUNNER_TEMP/launch-hermes-terminal.applescript" \
            > "$LAUNCH_LOG" 2>&1 < /dev/null &

          echo "Authentication launch requested."
          echo "Instructions: $INSTRUCTIONS"
          echo "Authentication log: $AUTH_LOG"

      - name: Configure Hermes Dashboard HTTPS
        id: hermes_https
        continue-on-error: true
        env:
          HERMES_DASHBOARD_USERNAME: mobile
        run: |
          set -e
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"

          command -v hermes >/dev/null 2>&1 || {
            echo "::error::Hermes CLI is missing."
            exit 1
          }

          command -v tailscale >/dev/null 2>&1 || {
            echo "::error::Tailscale CLI is missing."
            exit 1
          }

          DNS_NAME=$(tailscale status --json | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("Self",{}).get("DNSName","").rstrip("."))')

          if [ -z "$DNS_NAME" ]; then
            echo "::error::Could not determine Tailscale DNS name."
            exit 1
          fi

          HERMES_URL="https://${DNS_NAME}/"
          HERMES_PASSWORD=$(openssl rand -hex 20)
          HERMES_AUTH_SECRET=$(openssl rand -base64 32)

          echo "::add-mask::$HERMES_PASSWORD"
          echo "::add-mask::$HERMES_AUTH_SECRET"

          echo "HERMES_URL=$HERMES_URL" >> "$GITHUB_ENV"
          echo "HERMES_DASHBOARD_USERNAME=$HERMES_DASHBOARD_USERNAME" >> "$GITHUB_ENV"
          echo "HERMES_DASHBOARD_PASSWORD=$HERMES_PASSWORD" >> "$GITHUB_ENV"

          # Keep dashboard credentials in Hermes' private environment file.
          HERMES_DIR="$HOME/.hermes"
          ENV_FILE="$HERMES_DIR/.env"
          mkdir -p "$HERMES_DIR"
          touch "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          TMP_ENV=$(mktemp)
          grep -v -E '^(HERMES_DASHBOARD_BASIC_AUTH_USERNAME|HERMES_DASHBOARD_BASIC_AUTH_PASSWORD|HERMES_DASHBOARD_BASIC_AUTH_SECRET|HERMES_DASHBOARD_PUBLIC_URL)=' \
            "$ENV_FILE" > "$TMP_ENV" || true

          cat >> "$TMP_ENV" <<EOF
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USERNAME}
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_PASSWORD}
          HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_AUTH_SECRET}
          HERMES_DASHBOARD_PUBLIC_URL=${HERMES_URL%/}
          EOF

          install -m 600 "$TMP_ENV" "$ENV_FILE"
          rm -f "$TMP_ENV"

          # The backend remains loopback-only. Tailscale Serve is the HTTPS entry point.
          nohup env \
            HERMES_DASHBOARD_BASIC_AUTH_USERNAME="$HERMES_DASHBOARD_USERNAME" \
            HERMES_DASHBOARD_BASIC_AUTH_PASSWORD="$HERMES_PASSWORD" \
            HERMES_DASHBOARD_BASIC_AUTH_SECRET="$HERMES_AUTH_SECRET" \
            HERMES_DASHBOARD_PUBLIC_URL="${HERMES_URL%/}" \
            hermes dashboard --host 127.0.0.1 --port 9119 --no-open \
            > "$RUNNER_TEMP/hermes-dashboard.log" 2>&1 < /dev/null &

          echo $! > "$RUNNER_TEMP/hermes-dashboard.pid"

          READY=0
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:9119/api/status \
                -o "$RUNNER_TEMP/hermes-dashboard-status.json"; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/hermes-dashboard.log" || true
            echo "::error::Hermes dashboard did not start."
            exit 1
          fi

          python3 - "$RUNNER_TEMP/hermes-dashboard-status.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          if data.get("auth_required") is not True:
              raise SystemExit("Dashboard auth gate is not enabled.")
          if "basic" not in data.get("auth_providers", []):
              raise SystemExit("Dashboard basic auth provider is not active.")
          print("Hermes dashboard authentication is enabled.")
          PY

          sudo tailscale serve --bg --https=443 http://127.0.0.1:9119

          VERIFIED=0
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail \
                --connect-timeout 5 --max-time 10 \
                "$HERMES_URL/api/status" \
                -o "$RUNNER_TEMP/hermes-https-status.json"; then
              VERIFIED=1
              break
            fi
            sleep 4
          done

          if [ "$VERIFIED" -ne 1 ]; then
            sudo tailscale serve status || true
            echo "::error::HTTPS endpoint verification failed."
            exit 1
          fi

          # Verify the remote dashboard is still gated behind authentication.
          python3 - "$RUNNER_TEMP/hermes-https-status.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          if data.get("auth_required") is not True:
              raise SystemExit("HTTPS endpoint does not report authentication required.")
          if "basic" not in data.get("auth_providers", []):
              raise SystemExit("HTTPS endpoint does not report the basic auth provider.")
          print("HTTPS endpoint and authentication gate verified.")
          PY

          {
            echo "## Hermes Dashboard HTTPS"
            echo ""
            echo "Verified URL: ${HERMES_URL}"
            echo ""
            echo "Username: ${HERMES_DASHBOARD_USERNAME}"
            echo ""
            echo "Password is available only in the credentials artifact."
            echo ""
            echo "Keep this workflow running while using the dashboard."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Hermes dashboard is available over Tailscale HTTPS."
          echo "URL: $HERMES_URL"
          echo "Username: $HERMES_DASHBOARD_USERNAME"
          echo "Password is hidden; retrieve it from the credentials artifact."

      - name: Save Credentials (Private File)
        if: always()
        env:
          MAC_USER: ${{ env.MAC_USER }}
          MAC_PASSWORD: ${{ env.MAC_PASSWORD }}
          RUSTDESK_ID: ${{ env.RUSTDESK_ID }}
          RUSTDESK_PASSWORD: ${{ env.RUSTDESK_PASSWORD }}
          CURRENT_IP: ${{ env.CURRENT_IP }}
          IP_CITY: ${{ env.IP_CITY }}
          IP_COUNTRY: ${{ env.IP_COUNTRY }}
          IP_ORG: ${{ env.IP_ORG }}
          WARP_ENABLED: ${{ env.WARP_ENABLED }}
          HERMES_URL: ${{ env.HERMES_URL }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
          HERMES_DASHBOARD_USERNAME: ${{ env.HERMES_DASHBOARD_USERNAME }}
          HERMES_DASHBOARD_PASSWORD: ${{ env.HERMES_DASHBOARD_PASSWORD }}
        run: |
          mkdir -p credentials

          cat > credentials/connection-info.txt <<EOF
          ============================================================
                    GITHUB MAC REMOTE - CONNECTION INFO
          ============================================================

          Started by: ${{ github.actor }}
          Date/Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Run ID: ${{ github.run_id }}

          NETWORK
          Public IP: ${CURRENT_IP:-Unavailable}
          Location: ${IP_CITY:-Unknown}, ${IP_COUNTRY:-Unknown}
          Provider: ${IP_ORG:-Unknown}
          WARP VPN: ${WARP_ENABLED:-false}

          RUSTDESK
          ID: ${RUSTDESK_ID:-Unavailable}
          Password: ${RUSTDESK_PASSWORD:-Unavailable}

          MACOS ADMIN
          User: ${MAC_USER:-Unavailable}
          Password: ${MAC_PASSWORD:-Unavailable}

          HERMES DASHBOARD HTTPS
          URL: ${HERMES_URL:-Not available}
          Username: ${HERMES_DASHBOARD_USERNAME:-Unavailable}
          Password: ${HERMES_DASHBOARD_PASSWORD:-Unavailable}
          Tailscale IP: ${TAILSCALE_IP:-Unavailable}

          HOW TO CONNECT
          1. Connect to Tailscale on your iPhone.
          2. Open the HTTPS URL above in Safari.
          3. Sign in with the Hermes dashboard credentials.
          4. For remote desktop, use the RustDesk ID and password.

          WARNING: This file contains sensitive credentials.
          Do not share it publicly.
          ============================================================
          EOF

          chmod 600 credentials/connection-info.txt
          echo "Credentials file created; secrets are not printed to logs."

      - name: Upload Credentials Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credentials-${{ github.actor }}-${{ github.run_id }}
          path: credentials/connection-info.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Connection Instructions
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "             GITHUB MAC REMOTE - CONNECTION"
          echo "============================================================"
          echo "macOS User: ${MAC_USER:-Unavailable}"
          echo "RustDesk ID: ${RUSTDESK_ID:-Unavailable}"
          echo "Hermes HTTPS URL: ${HERMES_URL:-Not available}"
          echo "Hermes dashboard username: ${HERMES_DASHBOARD_USERNAME:-mobile}"
          echo ""
          echo "Download the credentials artifact:"
          echo "credentials-${{ github.actor }}-${{ github.run_id }}"
          echo ""
          echo "Passwords are not printed in workflow logs."
          echo "Requested session duration: $SESSION_DURATION hour(s)."

      - name: Keep Session Alive
        run: |
          chmod +x scripts/keep-alive.sh
          export DURATION_HOURS="${{ env.SESSION_DURATION }}"
          ./scripts/keep-alive.sh

      - name: Save IP History Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ip-history.json
          key: ip-history-${{ github.repository_owner }}-${{ github.run_id }}

      - name: Cleanup HTTPS and Dashboard
        if: always()
        run: |
          sudo tailscale serve reset || true

          if [ -f "$RUNNER_TEMP/hermes-dashboard.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/hermes-dashboard.pid")" 2>/dev/null || true
          fi

          echo "Temporary HTTPS and dashboard services cleaned up."
