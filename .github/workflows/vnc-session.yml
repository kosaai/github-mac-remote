name: macOS VNC Session (Verified Screen)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Session duration in hours'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

      macos_version:
        description: 'macOS version'
        required: true
        default: '14'
        type: choice
        options:
          - '14'
          - '15'
          - '26'

      runner_size:
        description: 'Runner size'
        required: true
        default: 'standard'
        type: choice
        options:
          - 'standard'
          - 'large'
          - 'xlarge'
          - 'intel'

permissions:
  contents: read

jobs:

  # ============================================================
  # ?????? Runner
  # ============================================================

  resolve-runner:
    name: Resolve macOS Runner
    runs-on: ubuntu-latest

    outputs:
      runner_label: ${{ steps.runner.outputs.label }}

    steps:
      - name: Select runner
        id: runner
        shell: bash
        run: |
          set -e

          OS="${{ inputs.macos_version }}"
          SIZE="${{ inputs.runner_size }}"

          case "$SIZE" in
            standard)
              LABEL="macos-${OS}"
              ;;

            large)
              LABEL="macos-${OS}-large"
              ;;

            xlarge)
              LABEL="macos-${OS}-xlarge"
              ;;

            intel)
              if [ "$OS" != "26" ]; then
                echo "ERROR: intel option requires macOS 26."
                exit 1
              fi
              LABEL="macos-26-intel"
              ;;

            *)
              echo "ERROR: Unknown runner size."
              exit 1
              ;;
          esac

          echo "Selected runner: $LABEL"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"


  # ============================================================
  # macOS VNC
  # ============================================================

  mac-vnc-session:
    name: macOS VNC via Tailscale

    needs: resolve-runner

    runs-on: "${{ needs.resolve-runner.outputs.runner_label }}"

    timeout-minutes: 370

    env:
      SESSION_DURATION: "${{ inputs.duration }}"

    steps:

      # ========================================================
      # Secrets
      # ========================================================

      - name: Validate secrets
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          if [ -z "$VNC_PASSWORD" ]; then
            echo "ERROR: VNC_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY secret is missing."
            exit 1
          fi

          if [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "ERROR: VNC_PASSWORD must be exactly 8 characters."
            exit 1
          fi

          echo "Secrets OK."


      # ========================================================
      # ??????? ??????
      # ========================================================

      - name: System information
        shell: bash
        run: |
          echo "=========================================="
          echo "macOS VNC Verified Session"
          echo "=========================================="

          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Runner:"
          echo "${{ needs.resolve-runner.outputs.runner_label }}"

          echo ""
          echo "Duration:"
          echo "${SESSION_DURATION} hour(s)"


      # ========================================================
      # Screen Sharing
      # ========================================================

      - name: Enable Screen Sharing and VNC
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -e

          echo "::add-mask::$VNC_PASSWORD"

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          SCREEN_PLIST="/System/Library/LaunchDaemons/com.apple.screensharing.plist"

          echo "Starting macOS Screen Sharing..."

          if [ ! -f "$KICKSTART" ]; then
            echo "ERROR: ARD kickstart is not available."
            exit 1
          fi


          # ----------------------------------------------------
          # Screen Sharing service
          # ----------------------------------------------------

          sudo launchctl enable \
            system/com.apple.screensharing \
            2>/dev/null || true

          sudo launchctl bootstrap \
            system \
            "$SCREEN_PLIST" \
            2>/dev/null || true

          sudo launchctl load \
            -w \
            "$SCREEN_PLIST" \
            2>/dev/null || true


          # ----------------------------------------------------
          # Remote Management + Legacy VNC
          # ----------------------------------------------------

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -allowAccessFor -allUsers \
            -privs -all \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes \
            -clientopts \
            -setvncpw \
            -vncpw "$VNC_PASSWORD" \
            -restart \
            -agent \
            -menu


          # ----------------------------------------------------
          # ????? ???????
          # ----------------------------------------------------

          sudo launchctl kickstart \
            -k \
            system/com.apple.screensharing \
            2>/dev/null || true

          sudo "$KICKSTART" \
            -restart \
            -agent \
            2>/dev/null || true


          # ----------------------------------------------------
          # ????? ?????? ??????? ??????
          # ----------------------------------------------------

          caffeinate -u -t 20 &
          sleep 8


          # ----------------------------------------------------
          # Port test
          # ----------------------------------------------------

          PORT_OK=0

          for i in {1..20}; do

            if nc -z 127.0.0.1 5900 2>/dev/null; then
              PORT_OK=1
              break
            fi

            echo "Waiting for TCP 5900... ${i}/20"
            sleep 2

          done


          if [ "$PORT_OK" -ne 1 ]; then
            echo "================================================"
            echo "FAIL: VNC SERVER DID NOT START"
            echo "TCP port 5900 is not listening."
            echo "================================================"
            exit 1
          fi

          echo "VNC TCP/5900 is listening."


      # ========================================================
      # ????? VNC client ????????
      # ========================================================

      - name: Install VNC framebuffer tester
        shell: bash
        run: |
          set -e

          python3 -m venv /tmp/vnc-test-env

          source /tmp/vnc-test-env/bin/activate

          python -m pip install \
            --upgrade \
            pip

          python -m pip install \
            vncdotool \
            pillow

          echo "VNC framebuffer tester installed."


      # ========================================================
      # ???????? ??????
      #
      # ??? ???? ?????? ?? VNC ????? ?????? ???? ??????? ??????.
      # ========================================================

      - name: TEST actual VNC framebuffer
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -e

          echo "::add-mask::$VNC_PASSWORD"

          source /tmp/vnc-test-env/bin/activate

          rm -f /tmp/vnc-frame.png

          echo ""
          echo "================================================"
          echo "TESTING THE ACTUAL VNC VIDEO OUTPUT"
          echo "================================================"
          echo ""

          # ????? display ?? ??? ?????
          caffeinate -u -t 15 &
          sleep 3


          # ----------------------------------------------------
          # VNC client ????? ??? framebuffer ???? ????? ???????
          # ----------------------------------------------------

          set +e

          vncdo \
            --timeout 20 \
            -s 127.0.0.1::5900 \
            -p "$VNC_PASSWORD" \
            capture /tmp/vnc-frame.png

          VNC_RESULT=$?

          set -e


          if [ "$VNC_RESULT" -ne 0 ]; then

            echo ""
            echo "================================================"
            echo "FAIL: VNC COULD NOT RETURN A SCREEN IMAGE"
            echo "================================================"
            echo ""
            echo "VNC connection exists, but an actual framebuffer"
            echo "could not be captured."
            echo ""
            echo "RVNC Viewer would therefore not be trusted to work."
            echo ""
            echo "Stopping workflow BEFORE Tailscale."
            echo ""

            exit 1
          fi


          if [ ! -s /tmp/vnc-frame.png ]; then

            echo ""
            echo "FAIL: VNC returned no image file."
            exit 1

          fi


          # ----------------------------------------------------
          # ????? ??????
          #
          # ????? ??:
          # - ????? ??????
          # - ????? ???????
          # - ???? ???????? ???????
          # - ???? ???????? ????? ???? ??????
          # ----------------------------------------------------

          python <<'PY'
          from PIL import Image, ImageStat
          import sys

          path = "/tmp/vnc-frame.png"

          try:
              img = Image.open(path).convert("RGB")
          except Exception as exc:
              print("FAIL: Cannot open captured VNC framebuffer:", exc)
              sys.exit(1)

          width, height = img.size

          gray = img.convert("L")
          stat = ImageStat.Stat(gray)

          mean = float(stat.mean[0])
          stddev = float(stat.stddev[0])

          histogram = gray.histogram()
          total = width * height

          # pixels ??????? ?????
          near_black_pixels = sum(histogram[0:8])
          black_ratio = near_black_pixels / total if total else 1.0

          extrema = gray.getextrema()

          print("")
          print("==============================================")
          print("VNC FRAMEBUFFER ANALYSIS")
          print("==============================================")
          print(f"Resolution      : {width} x {height}")
          print(f"Mean brightness : {mean:.2f}")
          print(f"Std deviation   : {stddev:.2f}")
          print(f"Near-black      : {black_ratio * 100:.2f}%")
          print(f"Brightness range: {extrema}")
          print("==============================================")
          print("")

          # ???? ??? ??????
          if width < 320 or height < 200:
              print("FAIL: VNC framebuffer resolution is invalid.")
              sys.exit(2)

          # ???? ????? ????? ?? ??? ?????
          if black_ratio >= 0.995:
              print("FAIL: VNC FRAMEBUFFER IS BLACK.")
              print("")
              print("Screen Sharing is connected,")
              print("but macOS is NOT sending the desktop image.")
              print("")
              print("Workflow will stop.")
              sys.exit(3)

          # ???? ????? ??????? ???? ?? ??????
          if mean < 5 and stddev < 2:
              print("FAIL: VNC framebuffer contains almost no visible image data.")
              print("Workflow will stop.")
              sys.exit(4)

          # ???? ????? ??? ???? ???????
          if stddev < 0.5:
              print("FAIL: VNC framebuffer appears blank/uniform.")
              sys.exit(5)

          print("SUCCESS: VNC IS TRANSMITTING A REAL SCREEN IMAGE.")
          print("Safe to continue to Tailscale.")
          PY


      # ========================================================
      # ??? ????? ????:
      # VNC ???? ???? ??????
      # ========================================================

      - name: Screen transmission verified
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "      SCREEN TRANSMISSION VERIFIED SUCCESSFULLY"
          echo "======================================================"
          echo ""
          echo "VNC returned an actual non-black framebuffer."
          echo ""
          echo "Connecting Tailscale now..."
          echo ""


      # ========================================================
      # Tailscale
      # ========================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-mac-vnc-${{ github.run_id }}
          version: latest
          timeout: 3m
          retry: 5
          args: --accept-dns=false


      # ========================================================
      # Tailscale IP
      # ========================================================

      - name: Get Tailscale IP
        shell: bash
        run: |
          set -e

          TAILSCALE_IP=""

          for i in {1..20}; do

            TAILSCALE_IP="$(
              tailscale ip -4 2>/dev/null |
              head -n 1 |
              tr -d '[:space:]'
            )"

            if [ -n "$TAILSCALE_IP" ]; then
              break
            fi

            echo "Waiting for Tailscale IP... ${i}/20"
            sleep 3

          done


          if [ -z "$TAILSCALE_IP" ]; then

            echo "ERROR: Could not obtain Tailscale IP."
            tailscale status || true
            exit 1

          fi


          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

          echo ""
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"


      # ========================================================
      # Final check
      # ========================================================

      - name: Final VNC check
        shell: bash
        run: |
          set -e

          nc -vz 127.0.0.1 5900

          echo ""
          echo "======================================================"
          echo "                VNC FULLY VERIFIED"
          echo "======================================================"
          echo ""
          echo "VNC server:           OK"
          echo "VNC authentication:   OK"
          echo "Framebuffer capture:  OK"
          echo "Screen is not black:  OK"
          echo "Tailscale:            OK"
          echo ""
          echo "Tailscale IP:"
          echo "${TAILSCALE_IP}"
          echo ""
          echo "RVNC Viewer address:"
          echo "${TAILSCALE_IP}:5900"
          echo ""
          echo "======================================================"


      # ========================================================
      # Summary
      # ========================================================

      - name: Write connection summary
        shell: bash
        run: |
          {
            echo "# ? macOS VNC verified"
            echo ""
            echo "The workflow successfully captured the actual VNC framebuffer."
            echo ""
            echo "**Screen transmission:** ? PASS"
            echo ""
            echo "**Tailscale IP:**"
            echo ""
            echo "\`${TAILSCALE_IP}\`"
            echo ""
            echo "**RVNC address:**"
            echo ""
            echo "\`${TAILSCALE_IP}:5900\`"
            echo ""
            echo "**Password:**"
            echo ""
            echo "Use your GitHub Secret: \`VNC_PASSWORD\`"
            echo ""
            echo "**macOS:**"
            echo ""
            echo "\`${{ inputs.macos_version }}\`"
            echo ""
            echo "**Runner:**"
            echo ""
            echo "\`${{ needs.resolve-runner.outputs.runner_label }}\`"
            echo ""
            echo "**Duration:**"
            echo ""
            echo "\`${SESSION_DURATION} hour(s)\`"
          } >> "$GITHUB_STEP_SUMMARY"


      # ========================================================
      # Session ready
      # ========================================================

      - name: Session ready
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "           macOS VNC SESSION READY"
          echo "======================================================"
          echo ""
          echo "Screen test: PASSED"
          echo ""
          echo "Address:"
          echo "${TAILSCALE_IP}:5900"
          echo ""
          echo "Password:"
          echo "Use your VNC_PASSWORD secret."
          echo ""
          echo "Duration:"
          echo "${SESSION_DURATION} hour(s)"
          echo ""
          echo "======================================================"


      # ========================================================
      # ????? ?????? ??????
      # ========================================================

      - name: Keep macOS session alive
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          HOURS="${SESSION_DURATION}"

          TOTAL_SECONDS=$((HOURS * 3600))
          INTERVAL=60
          ELAPSED=0

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "Keeping macOS alive for ${HOURS} hour(s)..."

          while [ "$ELAPSED" -lt "$TOTAL_SECONDS" ]; do

            REMAINING=$((TOTAL_SECONDS - ELAPSED))
            REMAINING_MIN=$((REMAINING / 60))

            echo "Session alive - approximately ${REMAINING_MIN} minutes remaining"


            # -----------------------------------------------
            # VNC watchdog
            # -----------------------------------------------

            if ! nc -z 127.0.0.1 5900 2>/dev/null; then

              echo "VNC stopped - restarting..."

              sudo launchctl enable \
                system/com.apple.screensharing \
                2>/dev/null || true

              sudo launchctl kickstart \
                -k \
                system/com.apple.screensharing \
                2>/dev/null || true

              sudo "$KICKSTART" \
                -activate \
                -configure \
                -access -on \
                -allowAccessFor -allUsers \
                -privs -all \
                -clientopts \
                -setvnclegacy \
                -vnclegacy yes \
                -clientopts \
                -setvncpw \
                -vncpw "$VNC_PASSWORD" \
                -restart \
                -agent \
                -menu \
                2>/dev/null || true

              sleep 5

            fi


            tailscale status >/dev/null 2>&1 || true

            sleep "$INTERVAL"

            ELAPSED=$((ELAPSED + INTERVAL))

          done

          echo "Session duration completed."
