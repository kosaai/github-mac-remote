name: macOS VNC Session (Tailscale)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Session duration in hours'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

      macos_version:
        description: 'macOS version'
        required: true
        default: '14'
        type: choice
        options:
          - '14'
          - '15'
          - '26'

      runner_size:
        description: 'Runner size'
        required: true
        default: 'standard'
        type: choice
        options:
          - 'standard'
          - 'large'
          - 'xlarge'
          - 'intel'

permissions:
  contents: read

jobs:

  # ============================================================
  # ????? Runner
  # ============================================================

  resolve-runner:
    name: Resolve macOS Runner
    runs-on: ubuntu-latest

    outputs:
      runner_label: ${{ steps.runner.outputs.label }}

    steps:
      - name: Select runner
        id: runner
        shell: bash
        run: |
          set -e

          OS="${{ inputs.macos_version }}"
          SIZE="${{ inputs.runner_size }}"

          case "$SIZE" in
            standard)
              LABEL="macos-${OS}"
              ;;

            large)
              LABEL="macos-${OS}-large"
              ;;

            xlarge)
              LABEL="macos-${OS}-xlarge"
              ;;

            intel)
              if [ "$OS" != "26" ]; then
                echo "ERROR: intel option is only supported here with macOS 26"
                exit 1
              fi
              LABEL="macos-26-intel"
              ;;

            *)
              echo "ERROR: Unknown runner size"
              exit 1
              ;;
          esac

          echo "Selected runner: ${LABEL}"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"


  # ============================================================
  # macOS + VNC + Tailscale
  # ============================================================

  mac-vnc-session:
    name: macOS VNC via Tailscale

    needs: resolve-runner

    runs-on: "${{ needs.resolve-runner.outputs.runner_label }}"

    timeout-minutes: 370

    env:
      SESSION_DURATION: "${{ inputs.duration }}"

    steps:

      # ========================================================
      # ??? Secrets
      # ========================================================

      - name: Validate secrets
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          if [ -z "$VNC_PASSWORD" ]; then
            echo "ERROR: VNC_PASSWORD secret is missing"
            exit 1
          fi

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY secret is missing"
            exit 1
          fi

          LENGTH="${#VNC_PASSWORD}"

          if [ "$LENGTH" -ne 8 ]; then
            echo "ERROR: VNC_PASSWORD must be exactly 8 characters."
            echo "Current length: $LENGTH"
            exit 1
          fi

          echo "Secrets are configured."


      # ========================================================
      # ??????? ?????
      # ========================================================

      - name: System information
        shell: bash
        run: |
          echo "=========================================="
          echo "macOS VNC Session"
          echo "=========================================="
          sw_vers
          echo ""
          uname -a
          echo ""
          echo "Architecture:"
          uname -m
          echo ""
          echo "Runner:"
          echo "${{ needs.resolve-runner.outputs.runner_label }}"
          echo ""
          echo "Requested duration:"
          echo "${SESSION_DURATION} hour(s)"


      # ========================================================
      # ????? Screen Sharing / VNC
      # ========================================================

      - name: Enable macOS Screen Sharing and VNC
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -e

          echo "::add-mask::$VNC_PASSWORD"

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          SCREEN_PLIST="/System/Library/LaunchDaemons/com.apple.screensharing.plist"

          echo "Enabling Screen Sharing..."

          # ????? ???? Screen Sharing
          sudo launchctl enable \
            system/com.apple.screensharing \
            2>/dev/null || true

          sudo launchctl bootstrap \
            system \
            "$SCREEN_PLIST" \
            2>/dev/null || true

          sudo launchctl load -w \
            "$SCREEN_PLIST" \
            2>/dev/null || true


          # ????? Apple Remote Desktop + VNC Legacy
          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -allowAccessFor -allUsers \
            -privs -all \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes \
            -clientopts \
            -setvncpw \
            -vncpw "$VNC_PASSWORD" \
            -restart \
            -agent \
            -menu


          # ====================================================
          # ?????? ????? Screen Sharing ????????? ??? macOS 14
          # ====================================================

          MACOS_MAJOR="$(sw_vers -productVersion | cut -d. -f1)"

          if [ "$MACOS_MAJOR" = "14" ]; then

            echo "Applying macOS 14 Screen Sharing permissions..."

            TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"

            if [ -f "$TCC_DB" ]; then

              NOW="$(date +%s)"

              sudo sqlite3 "$TCC_DB" "
              DELETE FROM access
              WHERE client='com.apple.screensharing.agent'
              AND service='kTCCServiceScreenCapture';
              " 2>/dev/null || true

              sudo sqlite3 "$TCC_DB" "
              DELETE FROM access
              WHERE client='com.apple.screensharing.agent'
              AND service='kTCCServicePostEvent';
              " 2>/dev/null || true

            fi

          fi


          # ????? ????? ???????
          sudo launchctl kickstart \
            -k \
            system/com.apple.screensharing \
            2>/dev/null || true

          sudo "$KICKSTART" \
            -restart \
            -agent \
            2>/dev/null || true


          echo "Waiting for VNC..."

          sleep 8


          # ??? TCP 5900
          SUCCESS=0

          for i in {1..20}; do

            if nc -z 127.0.0.1 5900 2>/dev/null; then
              SUCCESS=1
              echo "SUCCESS: VNC is listening on TCP port 5900"
              break
            fi

            echo "Waiting for VNC... ${i}/20"
            sleep 2

          done


          if [ "$SUCCESS" -ne 1 ]; then

            echo ""
            echo "ERROR: VNC did not start."
            echo ""

            sudo launchctl print \
              system/com.apple.screensharing \
              2>/dev/null || true

            echo ""

            sudo lsof \
              -nP \
              -iTCP \
              -sTCP:LISTEN \
              2>/dev/null || true

            exit 1
          fi


      # ========================================================
      # Tailscale
      # ========================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-mac-vnc-${{ github.run_id }}
          version: latest
          timeout: 3m
          retry: 5
          args: --accept-dns=false


      # ========================================================
      # ?????? ??? IP
      # ========================================================

      - name: Get Tailscale IP
        shell: bash
        run: |
          set -e

          TAILSCALE_IP=""

          echo "Waiting for Tailscale IP..."

          for i in {1..20}; do

            TAILSCALE_IP="$(
              tailscale ip -4 2>/dev/null |
              head -n 1 |
              tr -d '[:space:]'
            )"

            if [ -n "$TAILSCALE_IP" ]; then
              break
            fi

            echo "Waiting... ${i}/20"
            sleep 3

          done


          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: Could not obtain Tailscale IPv4"
            tailscale status || true
            exit 1
          fi


          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

          echo ""
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"
          echo ""

          tailscale status || true


      # ========================================================
      # ??? ?????
      # ========================================================

      - name: Final VNC check
        shell: bash
        run: |
          set -e

          echo "Checking local VNC..."

          nc -vz 127.0.0.1 5900

          echo ""
          echo "=========================================="
          echo "VNC READY"
          echo "=========================================="
          echo ""
          echo "Tailscale IP:"
          echo "${TAILSCALE_IP}"
          echo ""
          echo "RVNC address:"
          echo "${TAILSCALE_IP}:5900"
          echo ""


      # ========================================================
      # ????? ????????? ?? Summary
      # ???? ????? ???? ????
      # ========================================================

      - name: Write connection summary
        shell: bash
        run: |
          {
            echo "# ? macOS VNC Session"
            echo ""
            echo "## Connection"
            echo ""
            echo "**Tailscale IP:**"
            echo ""
            echo "\`${TAILSCALE_IP}\`"
            echo ""
            echo "**VNC address:**"
            echo ""
            echo "\`${TAILSCALE_IP}:5900\`"
            echo ""
            echo "**Password:**"
            echo ""
            echo "Use your GitHub secret **VNC_PASSWORD**"
            echo ""
            echo "**macOS:**"
            echo ""
            echo "\`${{ inputs.macos_version }}\`"
            echo ""
            echo "**Runner:**"
            echo ""
            echo "\`${{ needs.resolve-runner.outputs.runner_label }}\`"
            echo ""
            echo "**Duration:**"
            echo ""
            echo "\`${SESSION_DURATION} hour(s)\`"
          } >> "$GITHUB_STEP_SUMMARY"


      # ========================================================
      # ?????? ?????
      # ========================================================

      - name: Session ready
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "             macOS VNC SESSION READY"
          echo "======================================================"
          echo ""
          echo "Tailscale IP:"
          echo "${TAILSCALE_IP}"
          echo ""
          echo "VNC address:"
          echo "${TAILSCALE_IP}:5900"
          echo ""
          echo "Password:"
          echo "Use the VNC_PASSWORD secret you created."
          echo ""
          echo "Duration:"
          echo "${SESSION_DURATION} hour(s)"
          echo ""
          echo "======================================================"


      # ========================================================
      # ????? ????? ????
      # ========================================================

      - name: Keep macOS session alive
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          HOURS="${SESSION_DURATION}"

          TOTAL_SECONDS=$((HOURS * 3600))
          INTERVAL=60
          ELAPSED=0

          echo "Keeping macOS alive for ${HOURS} hour(s)..."

          while [ "$ELAPSED" -lt "$TOTAL_SECONDS" ]; do

            REMAINING=$((TOTAL_SECONDS - ELAPSED))
            REMAINING_MIN=$((REMAINING / 60))

            echo "Session alive - approximately ${REMAINING_MIN} minutes remaining"


            # -----------------------------------------------
            # ??? VNC ???? ???? ??????
            # -----------------------------------------------

            if ! nc -z 127.0.0.1 5900 2>/dev/null; then

              echo "VNC stopped - restarting..."

              KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

              sudo launchctl enable \
                system/com.apple.screensharing \
                2>/dev/null || true

              sudo launchctl kickstart \
                -k \
                system/com.apple.screensharing \
                2>/dev/null || true

              sudo "$KICKSTART" \
                -activate \
                -configure \
                -access -on \
                -allowAccessFor -allUsers \
                -privs -all \
                -clientopts \
                -setvnclegacy \
                -vnclegacy yes \
                -clientopts \
                -setvncpw \
                -vncpw "$VNC_PASSWORD" \
                -restart \
                -agent \
                -menu \
                2>/dev/null || true

              sleep 5

            fi


            # -----------------------------------------------
            # ??? Tailscale
            # -----------------------------------------------

            tailscale status >/dev/null 2>&1 || true


            sleep "$INTERVAL"

            ELAPSED=$((ELAPSED + INTERVAL))

          done

          echo "Session duration completed."
