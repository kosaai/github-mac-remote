name: macOS VNC Session (Tailscale)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Session duration in hours'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

      macos_version:
        description: 'macOS version'
        required: true
        default: '14'
        type: choice
        options:
          - '14'
          - '15'
          - '26'

      runner_size:
        description: 'Runner size'
        required: true
        default: 'standard'
        type: choice
        options:
          - 'standard'
          - 'large'
          - 'xlarge'
          - 'intel'

permissions:
  contents: read


# ============================================================
# JOB 1
# ????? ??? Runner ?????? ???? ??? runs-on expression ??????
# ============================================================

jobs:

  resolve-runner:
    name: Resolve macOS Runner
    runs-on: ubuntu-latest

    outputs:
      runner_label: ${{ steps.runner.outputs.label }}

    steps:

      - name: Select runner
        id: runner
        shell: bash
        run: |
          set -e

          OS="${{ inputs.macos_version }}"
          SIZE="${{ inputs.runner_size }}"

          echo "Requested macOS: $OS"
          echo "Requested size:  $SIZE"

          case "$SIZE" in

            standard)
              LABEL="macos-${OS}"
              ;;

            large)
              LABEL="macos-${OS}-large"
              ;;

            xlarge)
              LABEL="macos-${OS}-xlarge"
              ;;

            intel)
              if [ "$OS" != "26" ]; then
                echo "ERROR:"
                echo "The Intel option is supported here only with macOS 26."
                echo "Choose macOS 26 + intel,"
                echo "or use standard for macOS 14/15."
                exit 1
              fi

              LABEL="macos-26-intel"
              ;;

            *)
              echo "Unknown runner size: $SIZE"
              exit 1
              ;;
          esac

          echo "Selected runner: $LABEL"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"


  # ============================================================
  # JOB 2
  # macOS + VNC + Tailscale
  # ============================================================

  mac-vnc-session:
    name: macOS VNC via Tailscale

    needs:
      - resolve-runner

    runs-on: "${{ needs.resolve-runner.outputs.runner_label }}"

    timeout-minutes: 370

    env:
      SESSION_DURATION: "${{ inputs.duration }}"
      VNC_USER: "yourname"

    steps:

      # ========================================================
      # ??????? ??????
      # ========================================================

      - name: System information
        shell: bash
        run: |
          echo "=========================================="
          echo "macOS VNC Session"
          echo "=========================================="
          echo ""
          sw_vers
          echo ""
          uname -a
          echo ""
          echo "Architecture:"
          uname -m
          echo ""
          echo "Requested duration: ${SESSION_DURATION} hour(s)"
          echo "Runner: ${{ needs.resolve-runner.outputs.runner_label }}"


      # ========================================================
      # ????? ?????? ?????
      # ========================================================

      - name: Create VNC admin user
        shell: bash
        run: |
          set -e

          echo "Creating macOS administrator account..."

          # ???? ???? ?????? macOS
          LOCAL_PASSWORD="$(
            openssl rand -base64 32 |
            tr -dc 'A-Za-z0-9' |
            head -c 14
          )"

          # VNC Legacy password ?????
          # ????? 8 ???? ??????? ?? VNC ????????
          VNC_PASSWORD="$(
            openssl rand -base64 32 |
            tr -dc 'A-Za-z0-9' |
            head -c 8
          )"

          echo "::add-mask::$LOCAL_PASSWORD"
          echo "::add-mask::$VNC_PASSWORD"

          # ??? ???????? ??? ??? ??? ??????? ???? ????
          if id "${VNC_USER}" >/dev/null 2>&1; then
            sudo sysadminctl -deleteUser "${VNC_USER}" || true
            sleep 2
          fi

          sudo sysadminctl \
            -addUser "${VNC_USER}" \
            -fullName "VNC User" \
            -password "${LOCAL_PASSWORD}" \
            -admin

          sudo dseditgroup \
            -o edit \
            -a "${VNC_USER}" \
            -t user \
            admin || true

          echo "LOCAL_PASSWORD=$LOCAL_PASSWORD" >> "$GITHUB_ENV"
          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"

          echo "User created: ${VNC_USER}"


      # ========================================================
      # ????? Screen Sharing / VNC
      # ========================================================

      - name: Enable macOS Screen Sharing and VNC
        shell: bash
        run: |
          set -e

          echo "Enabling macOS Screen Sharing..."

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          SCREEN_PLIST="/System/Library/LaunchDaemons/com.apple.screensharing.plist"

          if [ ! -f "$KICKSTART" ]; then
            echo "ERROR: ARD kickstart not found:"
            echo "$KICKSTART"
            exit 1
          fi

          # ----------------------------------------------------
          # ????? Screen Sharing service
          # ----------------------------------------------------

          sudo launchctl enable \
            system/com.apple.screensharing \
            2>/dev/null || true

          sudo launchctl bootstrap \
            system \
            "$SCREEN_PLIST" \
            2>/dev/null || true

          sudo launchctl load -w \
            "$SCREEN_PLIST" \
            2>/dev/null || true


          # ----------------------------------------------------
          # ????? ???????? ??????? Remote Management
          # ----------------------------------------------------

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -allowAccessFor -specifiedUsers \
            -users "${VNC_USER}" \
            -privs -all \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes \
            -clientopts \
            -setvncpw \
            -vncpw "${VNC_PASSWORD}" \
            -restart \
            -agent


          # ----------------------------------------------------
          # ????? ???????? ??????? Screen Sharing
          # ----------------------------------------------------

          sudo dseditgroup \
            -o edit \
            -a "${VNC_USER}" \
            -t user \
            com.apple.access_screensharing \
            2>/dev/null || true


          # ----------------------------------------------------
          # macOS 14:
          # ?????? ??? Screen Sharing ?????? ????? ???????
          # ??? GitHub hosted runner
          # ----------------------------------------------------

          MACOS_MAJOR="$(sw_vers -productVersion | cut -d. -f1)"

          if [ "$MACOS_MAJOR" = "14" ]; then

            echo "Applying macOS 14 Screen Sharing permissions..."

            TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"

            if [ -f "$TCC_DB" ]; then

              EPOCH="$(date +%s)"

              sudo sqlite3 "$TCC_DB" "
                DELETE FROM access
                WHERE client = 'com.apple.screensharing.agent'
                AND service IN (
                  'kTCCServicePostEvent',
                  'kTCCServiceScreenCapture'
                );

                INSERT INTO access(
                  service,
                  client,
                  client_type,
                  auth_value,
                  auth_reason,
                  auth_version,
                  indirect_object_identifier_type,
                  flags,
                  last_modified,
                  last_reminded
                )
                VALUES(
                  'kTCCServicePostEvent',
                  'com.apple.screensharing.agent',
                  0,
                  2,
                  4,
                  1,
                  0,
                  0,
                  ${EPOCH},
                  ${EPOCH}
                );

                INSERT INTO access(
                  service,
                  client,
                  client_type,
                  auth_value,
                  auth_reason,
                  auth_version,
                  indirect_object_identifier_type,
                  flags,
                  last_modified,
                  last_reminded
                )
                VALUES(
                  'kTCCServiceScreenCapture',
                  'com.apple.screensharing.agent',
                  0,
                  2,
                  4,
                  1,
                  0,
                  0,
                  ${EPOCH},
                  ${EPOCH}
                );
              " || true

            fi
          fi


          # ----------------------------------------------------
          # ????? ????? Screen Sharing
          # ----------------------------------------------------

          sudo launchctl kickstart \
            -k \
            system/com.apple.screensharing \
            2>/dev/null || true

          sudo "$KICKSTART" \
            -restart \
            -agent \
            2>/dev/null || true

          sleep 8


          # ----------------------------------------------------
          # ?????? ?? Port 5900
          # ----------------------------------------------------

          echo ""
          echo "Checking VNC TCP/5900..."

          for i in {1..15}; do

            if nc -z 127.0.0.1 5900 2>/dev/null; then
              echo "SUCCESS: VNC is listening on TCP 5900"
              break
            fi

            echo "Waiting for VNC... ($i/15)"
            sleep 2
          done


          if ! nc -z 127.0.0.1 5900 2>/dev/null; then

            echo ""
            echo "ERROR: VNC did not start."
            echo ""

            sudo launchctl print \
              system/com.apple.screensharing \
              2>/dev/null || true

            echo ""
            sudo lsof \
              -nP \
              -iTCP \
              -sTCP:LISTEN \
              2>/dev/null || true

            exit 1
          fi


      # ========================================================
      # Tailscale
      # ========================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-vnc-${{ github.run_id }}
          version: latest
          timeout: 3m
          retry: 5
          args: --accept-dns=false


      # ========================================================
      # ??? IP ??? Tailscale
      # ========================================================

      - name: Get Tailscale IP
        shell: bash
        run: |
          set -e

          echo "Waiting for Tailscale IPv4 address..."

          TAILSCALE_IP=""

          for i in {1..20}; do

            TAILSCALE_IP="$(
              tailscale ip -4 2>/dev/null |
              head -n 1 |
              tr -d '[:space:]'
            )"

            if [ -n "$TAILSCALE_IP" ]; then
              break
            fi

            echo "Waiting... ($i/20)"
            sleep 3
          done

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: Could not obtain Tailscale IP"
            tailscale status || true
            exit 1
          fi

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "Tailscale connected"
          echo "IP: $TAILSCALE_IP"
          echo "=========================================="

          tailscale status || true


      # ========================================================
      # ?????? VNC ??? ?????
      # ========================================================

      - name: Final VNC check
        shell: bash
        run: |
          echo "Local VNC test..."

          if nc -z 127.0.0.1 5900; then
            echo "VNC local port: OK"
          else
            echo "ERROR: TCP 5900 stopped"
            exit 1
          fi

          echo ""
          echo "Tailscale IP: ${TAILSCALE_IP}"
          echo "VNC port:     5900"
          echo ""
          echo "RVNC / RealVNC address:"
          echo "${TAILSCALE_IP}:5900"


      # ========================================================
      # ??? ??????? ???????
      # ========================================================

      - name: Create connection information
        shell: bash
        run: |
          mkdir -p credentials

          cat > credentials/connection-info.txt << EOF
          ============================================================
                      macOS VNC via Tailscale
          ============================================================

          Tailscale IP:
          ${TAILSCALE_IP}

          VNC address:
          ${TAILSCALE_IP}:5900

          ------------------------------------------------------------

          VNC Legacy Password:
          ${VNC_PASSWORD}

          ------------------------------------------------------------

          macOS Username:
          ${VNC_USER}

          macOS User Password:
          ${LOCAL_PASSWORD}

          ------------------------------------------------------------

          iPhone RVNC / RealVNC Viewer:

          Address:
          ${TAILSCALE_IP}:5900

          First try:
          VNC password = ${VNC_PASSWORD}

          If macOS asks for normal user credentials:

          Username = ${VNC_USER}
          Password = ${LOCAL_PASSWORD}

          ------------------------------------------------------------

          Selected macOS:
          ${{ inputs.macos_version }}

          Runner:
          ${{ needs.resolve-runner.outputs.runner_label }}

          Session duration:
          ${SESSION_DURATION} hour(s)

          ============================================================
          EOF

          chmod 600 credentials/connection-info.txt


      - name: Upload VNC credentials
        uses: actions/upload-artifact@v4
        with:
          name: vnc-credentials-${{ github.run_id }}
          path: credentials/connection-info.txt
          retention-days: 1
          if-no-files-found: error


      # ========================================================
      # ??? ????????? ?? Logs
      # ???? ???? ?? ??????
      # ========================================================

      - name: Session ready
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "             macOS VNC SESSION READY"
          echo "======================================================"
          echo ""
          echo "Tailscale IP:"
          echo "${TAILSCALE_IP}"
          echo ""
          echo "VNC address:"
          echo "${TAILSCALE_IP}:5900"
          echo ""
          echo "Username:"
          echo "${VNC_USER}"
          echo ""
          echo "Passwords:"
          echo "Download the vnc-credentials artifact."
          echo ""
          echo "Session duration:"
          echo "${SESSION_DURATION} hour(s)"
          echo ""
          echo "======================================================"


      # ========================================================
      # ????? ????? ?????
      # ========================================================

      - name: Keep macOS session alive
        shell: bash
        run: |
          set -e

          HOURS="${SESSION_DURATION}"
          TOTAL_SECONDS=$((HOURS * 3600))
          INTERVAL=300
          ELAPSED=0

          echo "Keeping macOS alive for ${HOURS} hour(s)..."

          while [ "$ELAPSED" -lt "$TOTAL_SECONDS" ]; do

            REMAINING=$((TOTAL_SECONDS - ELAPSED))
            REMAINING_MIN=$((REMAINING / 60))

            echo "Session alive ? approximately ${REMAINING_MIN} minutes remaining"

            # ?? Screen Sharing ???? ????? ?????
            if ! nc -z 127.0.0.1 5900 2>/dev/null; then

              echo "VNC stopped - restarting Screen Sharing..."

              sudo launchctl enable \
                system/com.apple.screensharing \
                2>/dev/null || true

              sudo launchctl kickstart \
                -k \
                system/com.apple.screensharing \
                2>/dev/null || true

            fi

            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Requested session duration completed."
